# JitPack builds each tag into com.github.Brendan-Black.Graft:{api,loader,fabric,neoforge,gradle-plugin}:<tag>.
# Gradle runs on JDK 21 here and fetches the JDK 25 toolchain (settings.gradle.kts).
jdk:
  - openjdk21
install:
  - ./gradlew -p gradle-plugin publishToMavenLocal -x runTests
  - ./gradlew :api:publishToMavenLocal :loader:publishToMavenLocal :fabric:publishToMavenLocal :neoforge:publishToMavenLocal -x runTests
